[project]
name = "service-control-email"
version = "0.1.0"
description = ""
authors = [
    {name = "Diesto070",email = "diestoapp@gmail.com"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"


[tool.poetry.group.dev.dependencies]
django = "^6.0"
python-dotenv = "^1.2.1"
psycopg2-binary = "^2.9.11"
pillow = "^12.0.0"
redis = "^7.1.0"


[tool.poetry.group.lint.dependencies]
isort = "^7.0.0"
black = "^25.12.0"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3